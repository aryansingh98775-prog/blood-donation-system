{% extends "base.html" %}

{% block title %}Profile Settings - BloodLife{% endblock %}

{% block content %}
<div class="py-12 sm:py-16 px-4 sm:px-6 lg:px-8 max-w-2xl mx-auto">
    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200">
        
        <!-- Header -->
        <div class="flex items-center space-x-4 pb-6 border-b border-slate-100">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blood-600 to-rose-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-blood-500/20">
                {{ user['full_name'][:1] }}
            </div>
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight" style="font-family: 'Plus Jakarta Sans', sans-serif;">
                    Account Profile
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Manage your personal information and contact settings</p>
            </div>
        </div>

        <form action="{{ url_for('profile') }}" method="POST" class="mt-6 space-y-6">
            
            <!-- Read-only Medical Identity -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email (Permanent)</label>
                    <input type="text" disabled value="{{ user['email'] }}" class="w-full px-3 py-2 bg-slate-200/60 border border-slate-300 rounded-lg text-xs font-semibold text-slate-600 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Blood Group (Medical Record)</label>
                    <input type="text" disabled value="{{ user['blood_group'] or 'Not Recorded' }}" class="w-full px-3 py-2 bg-slate-200/60 border border-slate-300 rounded-lg text-xs font-bold text-blood-700 cursor-not-allowed">
                </div>
            </div>

            <!-- Editable Contact & Location -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Phone Number</label>
                    <input type="tel" name="phone" required value="{{ user['phone'] }}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blood-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">City / Location</label>
                    <input type="text" name="city" required value="{{ user['city'] }}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blood-500 focus:bg-white transition">
                </div>
            </div>

            <!-- Demographics -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Age</label>
                    <input type="number" name="age" min="16" max="75" value="{{ user['age'] or '' }}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blood-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Weight (kg)</label>
                    <input type="number" step="0.5" name="weight" value="{{ user['weight'] or '' }}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blood-500 focus:bg-white transition">
                </div>
            </div>

            <!-- Change Password (Optional) -->
            <div class="pt-4 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Change Password <span class="text-slate-400 font-normal lowercase">(leave blank to keep current)</span>
                </label>
                <input type="password" name="new_password" minlength="6" placeholder="Enter new password (min. 6 characters)" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blood-500 focus:bg-white transition">
            </div>

            <div>
                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-blood-600 to-rose-600 hover:from-blood-700 hover:to-rose-700 text-white font-bold text-sm rounded-xl transition shadow-lg shadow-blood-500/25 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Save Profile Changes</span>
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
